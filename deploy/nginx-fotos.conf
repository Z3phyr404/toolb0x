# Geteilte Foto-Galerien aus fotob0x (Phase 5, Variante A: reine Statik).
#
# Einbau (EINMALIG): im server-Block von toolb0x.eu (/etc/nginx/sites-available/…)
# diese Zeile ergänzen:
#     include /var/www/toolbox/finanz-app/deploy/nginx-fotos.conf;
# plus: mkdir -p /var/www/fotos && chown michael:michael /var/www/fotos
# (der Nutzer des SFTP-Remotes, mit dem fotob0x hochlädt, braucht Schreibrechte).
#
# DANACH ist diese Datei die Live-Konfiguration: Änderungen hier committen,
# auf dem Server `git pull`, dann `nginx -t && systemctl reload nginx`.
# Schlägt nginx -t fehl, läuft nginx mit der alten Config weiter (nichts down).
#
# Sicherheitsmodell:
# - fotob0x lädt pro geteiltem Album einen Ordner /var/www/fotos/<token>/ hoch
#   (token = 24 Zeichen base64url, kryptographisch zufällig). Wer das Token
#   nicht kennt, findet die Galerie nicht.
# - autoindex off + 404 auf /fotos/ selbst: Tokens lassen sich nicht auflisten.
# - X-Robots-Tag: Suchmaschinen indexieren nichts (zusätzlich steht noindex
#   als <meta> in jeder Galerie-Seite).
# - Es liegt dort NUR von fotob0x erzeugte Statik (verkleinerte JPEGs ohne
#   EXIF/GPS + index.html) - kein Skript, keine Uploads von außen.

location = /fotos/ { return 404; }

location ^~ /fotos/ {
    alias /var/www/fotos/;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, max-age=3600";
}

# Auto-Update-Feed der fotob0x-Desktop-App (2026-08-07): reine Statik
# (latest.yml + Setup.exe), hochgeladen per `npm run release` im fotob0x-Repo.
# Einbau-Voraussetzung (EINMALIG):
#     sudo mkdir -p /var/www/updates/fotob0x && sudo chown michael:michael /var/www/updates/fotob0x
location ^~ /updates/ {
    alias /var/www/updates/;
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# Upload-Posteingang (2026-08-07): Fotos von iPad/Mac → /var/www/fotos-inbox,
# fotob0x holt sie ab (SSOT bleibt der Windows-Rechner). Eigener location-Block,
# weil nur HIER große Bodies erlaubt sein sollen (RAW ~60 MB, Videos mehr) -
# der Rest der API bleibt beim nginx-Standardlimit von 1 MB.
# Einbau-Voraussetzung (EINMALIG, die Node-App läuft als michael):
#     sudo mkdir -p /var/www/fotos-inbox && sudo chown michael:michael /var/www/fotos-inbox
location ^~ /api/fotos/upload/ {
    client_max_body_size 1g;
    # Direkt an Node durchstreamen statt erst in eine nginx-Tempdatei puffern
    # (spart einen zweiten Schreibvorgang pro RAW-Datei).
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
